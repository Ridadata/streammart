# ============================================================================
# StreamMart — Real-Time E-Commerce Analytics Pipeline
# Docker Compose Configuration
# ============================================================================

services:

  # ==========================================================================
  # KAFKA ECOSYSTEM
  # ==========================================================================
  
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: streammart-kafka
    hostname: kafka
    ports:
      - "9092:9092"       # External host machine access
      - "9093:9093"       # Controller
      - "19092:19092"     # Internal Docker network
    environment:
      # KRaft mode configuration (NO Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      
      # Listeners (both internal Docker and external host access)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      
      # Cluster settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      
      # Log settings
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      
      # JMX for Prometheus
      KAFKA_JMX_PORT: 9991
      KAFKA_JMX_HOSTNAME: kafka

      # Explicit heap bound — without this, cp-kafka's default heap sizing
      # can consume most of a small mem_limit's headroom in bursts, starving
      # everything else on a memory-constrained host.
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - streammart-network
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 15s
      timeout: 10s
      retries: 10
    mem_limit: 1.25g
    memswap_limit: 1.25g

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.3
    container_name: streammart-schema-registry
    hostname: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_DEBUG: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - streammart-network
    healthcheck:
      test: curl -f http://localhost:8081/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    memswap_limit: 512m

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: streammart-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: streammart
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
      - schema-registry
    networks:
      - streammart-network
    mem_limit: 512m
    memswap_limit: 512m

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.5.3
    container_name: streammart-kafka-topics-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - streammart-network
    entrypoint: ["/bin/bash", "-c"]
    command: >
      '
      set -e;
      echo "Creating required Kafka topics...";
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic events.pageview --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic events.product_click --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic events.add_to_cart --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic events.purchase --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic events.abandonment --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic events.dlq --partitions 3 --replication-factor 1;
      echo "Kafka topics initialized.";
      '

  # ==========================================================================
  # STORAGE LAYER
  # ==========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: streammart-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/00_create_airflow_db.sql:/docker-entrypoint-initdb.d/00_create_airflow_db.sql
      - ./sql/init_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql
    networks:
      - streammart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    memswap_limit: 768m

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: streammart-pgadmin
    hostname: pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_DISABLE_POSTFIX: 'True'
    networks:
      - streammart-network
    mem_limit: 256m
    memswap_limit: 256m

  minio:
    image: minio/minio:latest
    container_name: streammart-minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - streammart-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    memswap_limit: 512m

  # Create MinIO bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: streammart-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - streammart-network
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      mc mb myminio/${MINIO_BUCKET} --ignore-existing;
      mc anonymous set download myminio/${MINIO_BUCKET};
      exit 0;
      "

  # ==========================================================================
  # SPARK CLUSTER
  # ==========================================================================

  spark-master:
    image: apache/spark:3.5.0
    container_name: streammart-spark-master
    hostname: spark-master
    user: root
    ports:
      - "7077:7077"
      - "8082:8080"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: 1
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
    volumes:
      - ./src/spark_jobs:/opt/spark-jobs
      - ./config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - spark-logs:/opt/spark/logs
      - spark-checkpoints:/tmp/checkpoints
    networks:
      - streammart-network
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck:
      test: curl -f http://localhost:8080 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: streammart-spark-worker-1
    hostname: spark-worker-1
    user: root
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: 1
      # SPARK_WORKER_CORES across both workers must be >= the number of
      # concurrently-running Spark job containers (4: raw_event_writer,
      # window_aggregator, session_tracker, revenue_aggregator), each of
      # which requests --total-executor-cores 1. The previous split (2+1=3
      # cores for 4 jobs) was confirmed live: the 4th job's executor request
      # sat in WAITING state on the Spark master forever since a core never
      # freed up. 2+2=4 matches exactly; see spark-worker-2 for the other half.
      SPARK_WORKER_MEMORY: 1536M
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./src/spark_jobs:/opt/spark-jobs
      - ./config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - spark-logs:/opt/spark/logs
      - spark-checkpoints:/tmp/checkpoints
    networks:
      - streammart-network
    mem_limit: 1.75g
    memswap_limit: 1.75g
    healthcheck:
      test: curl -f http://localhost:8081 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: streammart-spark-worker-2
    hostname: spark-worker-2
    user: root
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: 1
      SPARK_WORKER_MEMORY: 1536M
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./src/spark_jobs:/opt/spark-jobs
      - ./config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - spark-logs:/opt/spark/logs
      - spark-checkpoints:/tmp/checkpoints
    networks:
      - streammart-network
    mem_limit: 1.75g
    memswap_limit: 1.75g
    healthcheck:
      test: curl -f http://localhost:8081 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  spark-raw-event-writer:
    image: apache/spark:3.5.0
    container_name: streammart-spark-raw-event-writer
    user: root
    restart: on-failure:3
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./src/spark_jobs:/opt/spark-jobs
      - spark-checkpoints:/tmp/checkpoints
    networks:
      - streammart-network
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      KAFKA_BROKER: kafka:19092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    command: >
      /bin/bash -c "
      until curl -sf http://spark-master:8080 > /dev/null 2>&1 && curl -sf http://minio:9000/minio/health/live > /dev/null 2>&1; do
        echo 'Waiting for dependencies to be ready...'; sleep 2;
      done;
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --name StreamMart-RawEventWriter
      --executor-memory 768M
      --executor-cores 1
      --total-executor-cores 1
      --driver-memory 512M
      --repositories https://repo1.maven.org/maven2/
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
      --conf spark.cores.max=1
      --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
      --conf spark.hadoop.fs.s3a.access.key=${MINIO_ACCESS_KEY}
      --conf spark.hadoop.fs.s3a.secret.key=${MINIO_SECRET_KEY}
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      /opt/spark-jobs/raw_event_writer.py
      "

  spark-window-aggregator:
    image: apache/spark:3.5.0
    container_name: streammart-spark-window-aggregator
    user: root
    restart: on-failure:3
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./src/spark_jobs:/opt/spark-jobs
      - spark-checkpoints:/tmp/checkpoints
    networks:
      - streammart-network
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      KAFKA_BROKER: kafka:19092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      /bin/bash -c "
      until curl -sf http://spark-master:8080 > /dev/null 2>&1 && (echo > /dev/tcp/postgres/5432) > /dev/null 2>&1; do
        echo 'Waiting for dependencies to be ready...'; sleep 2;
      done;
      pip install --quiet psycopg2-binary;
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --name StreamMart-WindowAggregator
      --executor-memory 768M
      --executor-cores 1
      --total-executor-cores 1
      --driver-memory 512M
      --repositories https://repo1.maven.org/maven2/
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.6.0
      --conf spark.cores.max=1
      /opt/spark-jobs/window_aggregator.py
      "

  spark-session-tracker:
    image: apache/spark:3.5.0
    container_name: streammart-spark-session-tracker
    user: root
    restart: on-failure:3
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./src/spark_jobs:/opt/spark-jobs
      - spark-checkpoints:/tmp/checkpoints
    networks:
      - streammart-network
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      KAFKA_BROKER: kafka:19092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      /bin/bash -c "
      until curl -sf http://spark-master:8080 > /dev/null 2>&1 && (echo > /dev/tcp/postgres/5432) > /dev/null 2>&1; do
        echo 'Waiting for dependencies to be ready...'; sleep 2;
      done;
      pip install --quiet psycopg2-binary;
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --name StreamMart-SessionTracker
      --executor-memory 768M
      --executor-cores 1
      --total-executor-cores 1
      --driver-memory 512M
      --repositories https://repo1.maven.org/maven2/
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.6.0
      --conf spark.cores.max=1
      /opt/spark-jobs/session_tracker.py
      "

  spark-revenue-aggregator:
    image: apache/spark:3.5.0
    container_name: streammart-spark-revenue-aggregator
    user: root
    restart: on-failure:3
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./src/spark_jobs:/opt/spark-jobs
      - spark-checkpoints:/tmp/checkpoints
    networks:
      - streammart-network
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      KAFKA_BROKER: kafka:19092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      /bin/bash -c "
      until curl -sf http://spark-master:8080 > /dev/null 2>&1 && (echo > /dev/tcp/postgres/5432) > /dev/null 2>&1; do
        echo 'Waiting for dependencies to be ready...'; sleep 2;
      done;
      pip install --quiet psycopg2-binary;
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --name StreamMart-RevenueAggregator
      --executor-memory 768M
      --executor-cores 1
      --total-executor-cores 1
      --driver-memory 512M
      --repositories https://repo1.maven.org/maven2/
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.6.0
      --conf spark.cores.max=1
      /opt/spark-jobs/revenue_aggregator.py
      "

  event-generator:
    build:
      context: .
      dockerfile: Dockerfile.event-generator
    image: streammart-event-generator:1.0
    container_name: streammart-event-generator
    restart: on-failure:3
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      spark-window-aggregator:
        condition: service_started
      spark-session-tracker:
        condition: service_started
      spark-revenue-aggregator:
        condition: service_started
      spark-raw-event-writer:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:19092
      EVENT_GENERATOR_RATE: ${EVENT_GENERATOR_RATE}
      LOG_LEVEL: ${LOG_LEVEL}
    networks:
      - streammart-network
    mem_limit: 256m
    memswap_limit: 256m

  postgres-maintenance:
    image: postgres:15-alpine
    container_name: streammart-postgres-maintenance
    depends_on:
      postgres:
        condition: service_healthy
      spark-window-aggregator:
        condition: service_started
      spark-session-tracker:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./sql/maintenance.sql:/opt/sql/maintenance.sql:ro
    # NOTE: the psql+fallback line below must stay on ONE physical line. YAML's
    # ">" folded scalar only folds lines at the *base* indentation into a single
    # line; this whole block sits at base indentation, but a `||` continuation
    # split across two lines here previously produced a real embedded newline
    # in the resulting command string, which /bin/sh parsed as two statements
    # and failed with "syntax error: unexpected ||" — confirmed against a live
    # container run, not theoretical.
    command: >
      /bin/sh -c "
      until pg_isready -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do
        echo 'Waiting for postgres...'; sleep 2;
      done;
      while true; do
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /opt/sql/maintenance.sql || echo 'maintenance.sql run failed - will retry next cycle';
        sleep 60;
      done
      "
    networks:
      - streammart-network
    restart: on-failure:3
    mem_limit: 128m
    memswap_limit: 128m

  # ==========================================================================
  # AIRFLOW
  # ==========================================================================

  airflow-init:
    image: apache/airflow:2.8.0-python3.11
    container_name: streammart-airflow-init
    profiles: ["orchestration"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW_UID: ${AIRFLOW_UID}
    volumes:
      - ./src/airflow_dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
    networks:
      - streammart-network
    entrypoint: /bin/bash
    command: >
      -c "airflow db init &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USER}
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@streammart.local;
      airflow connections delete streammart_postgres 2>/dev/null;
      airflow connections add streammart_postgres
      --conn-type postgres
      --conn-host postgres
      --conn-port 5432
      --conn-schema ${POSTGRES_DB}
      --conn-login ${POSTGRES_USER}
      --conn-password ${POSTGRES_PASSWORD}"
    mem_limit: 1g
    memswap_limit: 1g

  airflow-webserver:
    image: apache/airflow:2.8.0-python3.11
    container_name: streammart-airflow-webserver
    hostname: airflow-webserver
    profiles: ["orchestration"]
    depends_on:
      - airflow-init
    ports:
      - "8085:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW_UID: ${AIRFLOW_UID}
      # pipeline_health_check_dag.py needs boto3 to inspect MinIO partitions.
      # Stock apache/airflow images don't include it; this is the documented
      # quick way to add a package without a custom image build (Airflow docs
      # note it's meant for dev/test, which matches this project's scope).
      _PIP_ADDITIONAL_REQUIREMENTS: 'boto3==1.34.18'
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./src/airflow_dags:/opt/airflow/dags
      - ./src/utils:/opt/airflow/utils
      - airflow-logs:/opt/airflow/logs
    networks:
      - streammart-network
    command: webserver
    mem_limit: 1g
    memswap_limit: 1g

  airflow-scheduler:
    image: apache/airflow:2.8.0-python3.11
    container_name: streammart-airflow-scheduler
    hostname: airflow-scheduler
    profiles: ["orchestration"]
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW_UID: ${AIRFLOW_UID}
      _PIP_ADDITIONAL_REQUIREMENTS: 'boto3==1.34.18'
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./src/airflow_dags:/opt/airflow/dags
      - ./src/utils:/opt/airflow/utils
      - airflow-logs:/opt/airflow/logs
    networks:
      - streammart-network
    command: scheduler
    mem_limit: 1g
    memswap_limit: 1g

  # ==========================================================================
  # MONITORING
  # ==========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: streammart-prometheus
    hostname: prometheus
    profiles: ["obs"]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - streammart-network
    mem_limit: 1g
    memswap_limit: 1g
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS}d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: streammart-postgres-exporter
    profiles: ["obs"]
    depends_on:
      - postgres
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - streammart-network

  grafana:
    image: grafana/grafana:latest
    container_name: streammart-grafana
    hostname: grafana
    profiles: ["obs"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # GF_INSTALL_PLUGINS: redis-datasource was previously set here despite
      # this project having no Redis service anywhere. Confirmed live: it
      # cost ~50s of startup time downloading a plugin from grafana.com that
      # nothing uses (Grafana installs configured plugins sequentially before
      # the web server starts serving traffic), and adds a network
      # dependency on the plugin registry being reachable for no benefit.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Consumed by config/grafana/datasources/postgres.yml via Grafana's
      # built-in $VARNAME provisioning-file expansion (Grafana >= 8.4.3).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres
    networks:
      - streammart-network
    mem_limit: 512m
    memswap_limit: 512m

  # ==========================================================================
  # KAFKA CONSUMER LAG (kafka-exporter)
  # Distinct from kafka-jmx-exporter below: JMX exposes broker-side metrics
  # (throughput, request rates, log sizes) but not consumer-group lag.
  # kafka-exporter queries the broker's consumer-group offset API directly,
  # independent of whether individual consumers expose JMX themselves (ours
  # don't — they're PySpark Structured Streaming jobs). Lag is the single
  # most important streaming health metric and was previously not collected
  # anywhere in this stack.
  # ==========================================================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: streammart-kafka-exporter
    profiles: ["obs"]
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:19092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - streammart-network

  # ==========================================================================
  # JMX EXPORTER FOR KAFKA METRICS
  # ==========================================================================
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: streammart-kafka-jmx-exporter
    profiles: ["obs"]
    ports:
      - "5556:5556"
    environment:
      SERVICE_PORT: 5556
    volumes:
      - ./config/jmx/kafka-jmx.yml:/etc/jmx-exporter/config.yml
    command:
      - "5556"
      - "/etc/jmx-exporter/config.yml"
    depends_on:
      - kafka
    networks:
      - streammart-network

  # ==========================================================================
  # LOKI FOR CENTRALIZED LOGGING
  # ==========================================================================
  loki:
    image: grafana/loki:latest
    container_name: streammart-loki
    profiles: ["obs"]
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/local-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - streammart-network
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:3100/loki/api/v1/status || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:latest
    container_name: streammart-promtail
    profiles: ["obs"]
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - streammart-network

# ==============================================================================
# VOLUMES
# ==============================================================================

volumes:
  kafka-data:
    driver: local
  postgres-data:
    driver: local
  minio-data:
    driver: local
  spark-logs:
    driver: local
  spark-checkpoints:
    driver: local
  airflow-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

# ==============================================================================
# NETWORKS
# ==============================================================================

networks:
  streammart-network:
    driver: bridge
    name: streammart-network
