# ==============================================================================
# Promtail Configuration
# Log collector for Docker containers, forwards to Loki
# ==============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ===========================================================================
  # DOCKER LOGS
  # ===========================================================================
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      # Extract container name as label
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      # Extract container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id
      # Extract image name
      - source_labels: ['__meta_docker_container_image_name']
        target_label: image
      # Extract docker network
      - source_labels: ['__meta_docker_network_name']
        target_label: network
        regex: (.*)
        action: replace
      # Add service label from container labels
      - source_labels: ['__meta_docker_container_label_service']
        target_label: service
      # Skip docker internal containers
      - source_labels: ['__meta_docker_container_name']
        regex: '.*docker-proxy.*'
        action: drop
    # pipeline_stages must live under a scrape_configs job, not at the
    # document root (a top-level `pipeline_stages:` key is not part of
    # Promtail's config schema and fails validation on startup — that bug is
    # why this container previously never started and Loki received nothing).
    #
    # None of the services in this stack emit JSON logs (Kafka, Postgres,
    # Spark, MinIO, etc. all log plain text; the Python event generator uses
    # a plain "%(levelname)s" format too), so a `json` parsing stage would
    # never actually extract anything. A regex stage that pulls a log level
    # out of the free-text line works across all of them and degrades
    # gracefully — a line with no match just doesn't get a `level` label,
    # it doesn't fail the pipeline.
    pipeline_stages:
      - regex:
          expression: '.*(?P<level>DEBUG|INFO|WARNING|WARN|ERROR|CRITICAL|FATAL).*'
      - labels:
          level:

  # ===========================================================================
  # SYSTEM LOGS
  # ===========================================================================
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
