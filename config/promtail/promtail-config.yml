# ==============================================================================
# Promtail Configuration
# Log collector for Docker containers, forwards to Loki
# ==============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ===========================================================================
  # DOCKER LOGS
  # ===========================================================================
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      # Extract container name as label
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      # Extract container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id
      # Extract image name
      - source_labels: ['__meta_docker_container_image_name']
        target_label: image
      # Extract docker network
      - source_labels: ['__meta_docker_network_name']
        target_label: network
        regex: (.*)
        action: replace
      # Add service label from container labels
      - source_labels: ['__meta_docker_container_label_service']
        target_label: service
      # Skip docker internal containers
      - source_labels: ['__meta_docker_container_name']
        regex: '.*docker-proxy.*'
        action: drop

  # ===========================================================================
  # SYSTEM LOGS
  # ===========================================================================
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log

# ==============================================================================
# Loki Pipelines (optional log processing)
# ==============================================================================
pipeline_stages:
  - json:
      expressions:
        timestamp: timestamp
        level: level
        msg: message
  - labels:
      level:
      msg:
