# ============================================================================
# Prometheus Configuration
# Scrapes metrics from all StreamMart components
# ============================================================================

global:
  scrape_interval: 15s  # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'streammart-local'
    environment: 'development'

# Alerting configuration (optional - requires Alertmanager)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Rule files (for alerting rules)
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:

  # ============================================================================
  # PROMETHEUS SELF-MONITORING
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ============================================================================
  # KAFKA CONSUMER LAG
  # ============================================================================
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'
          component: 'consumer-lag'

  # ============================================================================
  # KAFKA METRICS (JMX Exporter)
  # ============================================================================
  - job_name: 'kafka-jmx'
    static_configs:
      - targets: ['kafka-jmx-exporter:5556']
        labels:
          service: 'kafka'
          component: 'jmx-exporter'
    metric_relabel_configs:
      # Keep only important Kafka metrics to reduce cardinality
      - source_labels: [__name__]
        regex: 'kafka_(server|network|controller|log)_.*'
        action: keep

  # ============================================================================
  # POSTGRES EXPORTER
  # ============================================================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'streammart'

  # ============================================================================
  # MINIO METRICS
  # ============================================================================
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'

  # ============================================================================
  # SPARK METRICS — built-in PrometheusServlet sink
  # config/spark/metrics.properties is mounted into spark-master and both
  # spark-worker-* containers at /opt/spark/conf/metrics.properties, which
  # Spark loads automatically. See that file for why each instance
  # (master/applications/worker) needs its own metrics path.
  # ============================================================================
  - job_name: 'spark-master'
    metrics_path: /metrics/master/prometheus
    static_configs:
      - targets: ['spark-master:8080']
        labels:
          service: 'spark'
          component: 'master'

  - job_name: 'spark-applications'
    metrics_path: /metrics/applications/prometheus
    static_configs:
      - targets: ['spark-master:8080']
        labels:
          service: 'spark'
          component: 'applications'

  - job_name: 'spark-worker'
    metrics_path: /metrics/worker/prometheus
    static_configs:
      - targets: ['spark-worker-1:8081', 'spark-worker-2:8081']
        labels:
          service: 'spark'
          component: 'worker'

  # ============================================================================
  # KAFKA UI EXPORTER (if available)
  # ============================================================================
  # - job_name: 'kafka-ui'
  #   static_configs:
  #     - targets: ['kafka-ui:8080']
  #       labels:
  #         service: 'kafka-ui'
