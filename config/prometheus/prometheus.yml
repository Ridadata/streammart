# ============================================================================
# Prometheus Configuration
# Scrapes metrics from all StreamMart components
# ============================================================================

global:
  scrape_interval: 15s  # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'streammart-local'
    environment: 'development'

# Alerting configuration (optional - requires Alertmanager)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Rule files (for alerting rules)
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:

  # ============================================================================
  # PROMETHEUS SELF-MONITORING
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ============================================================================
  # KAFKA METRICS (JMX Exporter)
  # ============================================================================
  - job_name: 'kafka-jmx'
    static_configs:
      - targets: ['kafka-jmx-exporter:5556']
        labels:
          service: 'kafka'
          component: 'jmx-exporter'
    metric_relabel_configs:
      # Keep only important Kafka metrics to reduce cardinality
      - source_labels: [__name__]
        regex: 'kafka_(server|network|controller|log)_.*'
        action: keep

  # ============================================================================
  # POSTGRES EXPORTER
  # ============================================================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'streammart'

  # ============================================================================
  # MINIO METRICS
  # ============================================================================
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'

  # ============================================================================
  # SPARK METRICS (if Spark metrics endpoint is exposed)
  # Note: Requires spark.metrics.conf configuration
  # ============================================================================
  # - job_name: 'spark-master'
  #   static_configs:
  #     - targets: ['spark-master:8080']
  #       labels:
  #         service: 'spark'
  #         component: 'master'

  # - job_name: 'spark-worker'
  #   static_configs:
  #     - targets: ['spark-worker-1:8081']
  #       labels:
  #         service: 'spark'
  #         component: 'worker'

  # ============================================================================
  # KAFKA UI EXPORTER (if available)
  # ============================================================================
  # - job_name: 'kafka-ui'
  #   static_configs:
  #     - targets: ['kafka-ui:8080']
  #       labels:
  #         service: 'kafka-ui'
