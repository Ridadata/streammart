# ==============================================================================
# Spark Metrics Configuration — Prometheus Servlet
# Mounted into spark-master/spark-worker-* at /opt/spark/conf/metrics.properties
# (Spark auto-loads $SPARK_CONF_DIR/metrics.properties if present).
#
# Spark >= 3.0 ships a built-in PrometheusServlet sink — no external JMX
# exporter or javaagent needed for cluster-level (master/worker/applications)
# metrics. Each instance needs its own `path` because the master process
# serves both the `master` and `applications` sinks on the same Jetty server
# (port 8080 internally); without distinct paths they'd collide.
#
# This covers cluster health (worker count, cores, memory, running/waiting
# apps) — it does NOT cover per-job driver/executor metrics (task counts,
# shuffle read/write, GC time), which would need this same file mounted into
# each spark-<job> container plus a `driver`/`executor` sink path. Left as a
# documented follow-up (see ENGINEERING.md roadmap) rather than done here, to keep
# this change scoped to the two dashboards Prometheus was already configured
# to scrape (master, worker) but commented out.
# ==============================================================================

master.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
master.sink.prometheusServlet.path=/metrics/master/prometheus

applications.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
applications.sink.prometheusServlet.path=/metrics/applications/prometheus

worker.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
worker.sink.prometheusServlet.path=/metrics/worker/prometheus
