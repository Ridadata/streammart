<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1000" fill="#fafbfc"/>

  <!-- Title -->
  <text x="700" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2328">StreamMart — Real-Time E-Commerce Analytics Pipeline</text>
  <text x="700" y="66" text-anchor="middle" font-size="14" fill="#57606a">Streaming layer (seconds-to-minutes) feeds dashboards · Batch layer (nightly) is authoritative for reporting</text>

  <!-- ============ Event Simulator ============ -->
  <rect x="570" y="90" width="260" height="56" rx="10" fill="#2d333b" stroke="#1f2328" stroke-width="1.5"/>
  <text x="700" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Event Simulator</text>
  <text x="700" y="132" text-anchor="middle" font-size="11.5" fill="#d0d7de">5 event types · EVENT_GENERATOR_RATE</text>

  <line x1="700" y1="146" x2="700" y2="172" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Kafka ============ -->
  <rect x="100" y="176" width="1200" height="104" rx="12" fill="#241f21" stroke="#1a1717" stroke-width="1.5"/>
  <text x="126" y="200" font-size="15" font-weight="700" fill="#ffffff">Kafka</text>
  <text x="126" y="216" font-size="11" fill="#c9c9c9">KRaft · 3 partitions each · key = session_id</text>

  <!-- 6 topic pills -->
  <g font-size="11.5" fill="#241f21" font-weight="600">
    <rect x="126" y="228" width="176" height="34" rx="17" fill="#ffffff"/>
    <text x="214" y="250" text-anchor="middle">events.pageview</text>

    <rect x="316" y="228" width="192" height="34" rx="17" fill="#ffffff"/>
    <text x="412" y="250" text-anchor="middle">events.product_click</text>

    <rect x="522" y="228" width="176" height="34" rx="17" fill="#ffffff"/>
    <text x="610" y="250" text-anchor="middle">events.add_to_cart</text>

    <rect x="712" y="228" width="152" height="34" rx="17" fill="#ffffff"/>
    <text x="788" y="250" text-anchor="middle">events.purchase</text>

    <rect x="878" y="228" width="176" height="34" rx="17" fill="#ffffff"/>
    <text x="966" y="250" text-anchor="middle">events.abandonment</text>

    <rect x="1068" y="228" width="112" height="34" rx="17" fill="#3a3335" stroke="#565051"/>
    <text x="1124" y="250" text-anchor="middle" fill="#e5e5e5">events.dlq</text>
  </g>

  <!-- fan-out arrows Kafka -> 4 spark jobs -->
  <line x1="270" y1="280" x2="270" y2="320" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="280" x2="590" y2="320" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="280" x2="880" y2="320" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1170" y1="280" x2="1170" y2="320" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 4 Spark jobs ============ -->
  <!-- shared style: orange fill -->
  <g>
    <rect x="130" y="322" width="280" height="70" rx="10" fill="#E25A1C" stroke="#b8460f" stroke-width="1.5"/>
    <text x="270" y="350" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Raw Event Writer</text>
    <text x="270" y="368" text-anchor="middle" font-size="10.5" fill="#ffe3d3">schema-on-read Parquet writer</text>
    <text x="270" y="382" text-anchor="middle" font-size="10.5" fill="#ffe3d3">continuous append</text>

    <rect x="450" y="322" width="280" height="70" rx="10" fill="#E25A1C" stroke="#b8460f" stroke-width="1.5"/>
    <text x="590" y="346" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Window Aggregator</text>
    <text x="590" y="364" text-anchor="middle" font-size="10.5" fill="#ffe3d3">1-min AND 5-min windows</text>
    <text x="590" y="379" text-anchor="middle" font-size="10.5" fill="#ffe3d3">computed independently — not summed</text>

    <rect x="740" y="322" width="280" height="70" rx="10" fill="#E25A1C" stroke="#b8460f" stroke-width="1.5"/>
    <text x="880" y="346" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Session Tracker</text>
    <text x="880" y="364" text-anchor="middle" font-size="10.5" fill="#ffe3d3">session_window · 30-min gap</text>
    <text x="880" y="379" text-anchor="middle" font-size="10.5" fill="#ffe3d3">append mode · lands ~40-70min later</text>

    <rect x="1030" y="322" width="280" height="70" rx="10" fill="#E25A1C" stroke="#b8460f" stroke-width="1.5"/>
    <text x="1170" y="346" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Revenue Aggregator</text>
    <text x="1170" y="364" text-anchor="middle" font-size="10.5" fill="#ffe3d3">daily tumbling window</text>
    <text x="1170" y="379" text-anchor="middle" font-size="10.5" fill="#ffe3d3">bounded state, real window() key</text>
  </g>

  <!-- arrows spark -> storage -->
  <line x1="270" y1="392" x2="270" y2="440" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="392" x2="590" y2="440" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="392" x2="880" y2="440" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1170" y1="392" x2="1170" y2="440" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Storage row ============ -->
  <!-- MinIO -->
  <rect x="130" y="444" width="280" height="66" rx="10" fill="#C4362D" stroke="#8f261f" stroke-width="1.5"/>
  <text x="270" y="470" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">MinIO Data Lake</text>
  <text x="270" y="488" text-anchor="middle" font-size="10.5" fill="#ffd6d2">year/month/day/event_type Parquet</text>

  <!-- Postgres group background -->
  <rect x="440" y="424" width="870" height="106" rx="14" fill="#eaf1f8" stroke="#b6d0e8" stroke-width="1.5"/>
  <text x="460" y="444" font-size="12.5" font-weight="700" fill="#1f3a5f">PostgreSQL — one writer per table</text>

  <rect x="450" y="450" width="280" height="66" rx="10" fill="#1f3a5f" stroke="#12263d" stroke-width="1.5"/>
  <text x="590" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">metrics_1min</text>
  <text x="590" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">metrics_5min</text>

  <rect x="740" y="450" width="280" height="66" rx="10" fill="#1f3a5f" stroke="#12263d" stroke-width="1.5"/>
  <text x="880" y="480" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">session_summary</text>
  <text x="880" y="498" text-anchor="middle" font-size="10" fill="#c9d9ea">(hidden by design)</text>

  <rect x="1030" y="450" width="280" height="66" rx="10" fill="#1f3a5f" stroke="#12263d" stroke-width="1.5"/>
  <text x="1170" y="480" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">product_performance</text>

  <!-- arrows postgres -> airflow (reads, dashed) -->
  <line x1="590" y1="516" x2="590" y2="568" stroke="#8b949e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowDashed)"/>
  <line x1="880" y1="516" x2="700" y2="568" stroke="#8b949e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowDashed)"/>

  <!-- ============ Airflow ============ -->
  <rect x="450" y="572" width="500" height="80" rx="12" fill="#00A19A" stroke="#00726d" stroke-width="1.5"/>
  <text x="700" y="600" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Airflow — Nightly Reconciliation</text>
  <text x="700" y="620" text-anchor="middle" font-size="10.5" fill="#d7f5f2">4 DAGs · daily_summary (01:00) · daily_batch_processing (02:00)</text>
  <text x="700" y="636" text-anchor="middle" font-size="10.5" fill="#d7f5f2">data_quality (6h) · pipeline_health_check (hourly)</text>

  <line x1="700" y1="652" x2="700" y2="694" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="530" y="698" width="340" height="56" rx="10" fill="#1f3a5f" stroke="#12263d" stroke-width="1.5"/>
  <text x="700" y="722" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">daily_revenue</text>
  <text x="700" y="740" text-anchor="middle" font-size="10.5" fill="#c9d9ea">authoritative — reported externally</text>

  <!-- ============ Observability ============ -->
  <line x1="270" y1="510" x2="270" y2="820" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="3,5"/>
  <line x1="270" y1="820" x2="470" y2="820" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="3,5" marker-end="url(#arrowDashed)"/>

  <line x1="1170" y1="516" x2="1170" y2="800" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="3,5"/>
  <line x1="1170" y1="800" x2="960" y2="800" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="3,5" marker-end="url(#arrowDashed)"/>

  <line x1="700" y1="754" x2="700" y2="800" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="330" y="804" width="300" height="90" rx="12" fill="#6B46C1" stroke="#4c2f96" stroke-width="1.5"/>
  <text x="480" y="832" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Prometheus</text>
  <text x="480" y="850" text-anchor="middle" font-size="10.5" fill="#e4dbfa">9 scrape targets · Kafka JMX + lag</text>
  <text x="480" y="865" text-anchor="middle" font-size="10.5" fill="#e4dbfa">MinIO · Postgres · Spark PrometheusServlet</text>
  <text x="480" y="882" text-anchor="middle" font-size="10.5" fill="#e4dbfa">all confirmed live "up"</text>

  <line x1="630" y1="849" x2="770" y2="849" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="770" y="804" width="300" height="90" rx="12" fill="#F46800" stroke="#c14f00" stroke-width="1.5"/>
  <text x="920" y="832" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Grafana</text>
  <text x="920" y="850" text-anchor="middle" font-size="10.5" fill="#ffe3cc">1 dashboard · 9 panels</text>
  <text x="920" y="865" text-anchor="middle" font-size="10.5" fill="#ffe3cc">2 datasources: Postgres + Prometheus</text>
  <text x="920" y="882" text-anchor="middle" font-size="10.5" fill="#ffe3cc">event rate · conversion · DQ pass rate</text>

  <!-- Legend -->
  <g font-size="11" fill="#57606a">
    <line x1="130" y1="928" x2="160" y2="928" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="168" y="932">writes</text>
    <line x1="230" y1="928" x2="260" y2="928" stroke="#8b949e" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrowDashed)"/>
    <text x="268" y="932">reads</text>
    <line x1="330" y1="928" x2="360" y2="928" stroke="#b0b8c1" stroke-width="1.5" stroke-dasharray="3,5" marker-end="url(#arrowDashed)"/>
    <text x="368" y="932">scrapes / monitors</text>
  </g>
  <text x="1270" y="932" text-anchor="end" font-size="11" fill="#8b949e">Full detail: ARCHITECTURE.md</text>
</svg>
